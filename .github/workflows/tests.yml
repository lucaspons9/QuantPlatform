name: research-integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: pytest
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/quantlab
      - name: Offline reference acceptance
        run: |
          DATASET=$(quantlab data synthetic)
          quantlab data validate "$DATASET"
          quantlab experiment run configs/momentum_synthetic.yaml --dataset "$DATASET"
      - name: Execute introduction notebook
        run: jupyter nbconvert --to notebook --execute notebooks/getting_started.ipynb --output /tmp/getting_started.executed.ipynb --ExecutePreprocessor.timeout=300
